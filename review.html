<title>血液分野② 復習ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one question at a time in a single reading column; progress map of all 36 above it. Palette from Color Hunt #FFF5E4 #FFE3E1 #FFD1D1 #FF9494. */
:root{
  --paper:#FFF5E4; --blush:#FFE3E1; --rose:#FFD1D1; --coral:#FF9494;
  --card:#FFFCF6; --ink:#3B2427; --muted:#7D5E60; --accent:#C04A55;
  --ok:#2F8465; --ok-bg:#DDF1E7; --ng:#C04A55; --ng-bg:#FFE3E1;
  --line:#F3CFCB;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#231A1B; --blush:#3A2A2C; --rose:#5B3B3F; --coral:#FF9494;
  --card:#2C2223; --ink:#F6E8E4; --muted:#C7ABA9; --accent:#FFA3A3;
  --ok:#7ED3AE; --ok-bg:#1F3A2F; --ng:#FFA3A3; --ng-bg:#4A2A2E; --line:#4A3336; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#231A1B; --blush:#3A2A2C; --rose:#5B3B3F; --coral:#FF9494;
  --card:#2C2223; --ink:#F6E8E4; --muted:#C7ABA9; --accent:#FFA3A3;
  --ok:#7ED3AE; --ok-bg:#1F3A2F; --ng:#FFA3A3; --ng-bg:#4A2A2E; --line:#4A3336; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:28px 12px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.3;margin:4px 0 0;text-wrap:balance}
h1 .mark{background:linear-gradient(transparent 62%,var(--rose) 62%)}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:20px;color:var(--ink);font-weight:500;margin-right:2px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--blush);border-radius:3px;margin-top:10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--coral)}

.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:16px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#3B1418;font-weight:700}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,.cell:focus-visible,.blank:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
label.sw{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin:8px 0 22px}
.cell{font-family:var(--f-mono);font-size:12px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.ng{background:var(--ng-bg);border-color:var(--coral);color:var(--ng)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.dim{opacity:.28}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px 22px 18px}
@media (max-width:480px){.card{padding:18px 16px 14px;border-radius:14px}}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qno{font-family:var(--f-disp);font-weight:700;font-size:22px;color:var(--accent)}
.tag{font-size:12px;background:var(--blush);color:var(--muted);padding:1px 10px;border-radius:999px}
.tag.two{background:var(--coral);color:#3B1418;font-weight:700}
.stem{font-size:17px;font-weight:500;margin:4px 0 14px}
.fig{margin:0 0 16px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);max-width:420px}
.fig img{display:block;width:100%}
.opts{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){background:var(--blush);border-color:var(--rose)}
.opt .num{font-family:var(--f-mono);font-size:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--coral);background:var(--blush)}
.opt.sel .num{background:var(--coral);color:#3B1418}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .num{background:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--coral);background:var(--ng-bg)}
.opt .mk{font-weight:700;font-size:13px;white-space:nowrap;align-self:center}
.opt.right .mk{color:var(--ok)} .opt.wrong .mk{color:var(--ng)}
.opt .note{grid-column:2 / 4;font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:-2px}

.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:16px}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:8px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#3B1418}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}

.verdict{margin-top:18px;padding:10px 14px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.ng{background:var(--ng-bg);color:var(--ng)}
.verdict span{font-weight:500;color:var(--ink)}

.points{margin-top:20px;border-top:1.5px dashed var(--line);padding-top:16px}
.points h2{font-family:var(--f-disp);font-size:17px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.points .hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.points ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.points li{padding-left:1.3em;position:relative;font-size:15px}
.points li::before{content:"☆";position:absolute;left:0;color:var(--coral)}
.blank{font:inherit;display:inline;border:0;border-bottom:2px solid var(--coral);background:var(--blush);color:transparent;border-radius:4px 4px 0 0;padding:0 4px;cursor:pointer;min-width:3em;line-height:1.5;user-select:none}
.blank.open{color:var(--accent);font-weight:700;background:transparent;cursor:text;user-select:text}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.confirm{display:inline-flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">臨床検査技師国家試験対策 ・ 総合演習Ⅱ</div>

</footer>
</div>

<script>
const Q = [{"n":1,"c":"lab","q":"自動血球計数装置で血小板が偽低値を示すのはどれか。","o":["破砕赤血球の出現","白血球減少症","血小板無力症","巨大血小板の出現","クリオグロブリン血症"],"a":[4],"e":["偽高値になる（血小板の大きさとして数えられる）。","血小板数には影響しない。","機能の異常で、血小板数は正常。","正しい。血小板として数えられず、偽低値になる。","偽高値になる（クリオグロブリンの粒子を数える）。"],"p":["PLT 偽低値：[[偽性血小板減少（EDTA 依存性）]]・[[巨大血小板]]・[[血小板衛星現象]]・血小板凝集","PLT 偽高値：[[破砕赤血球]]・[[クリオグロブリン]]","RBC 偽低値・Ht 偽低値：[[寒冷凝集]]、溶血、小赤血球","WBC 偽高値：[[有核赤血球]]、赤血球の溶血不良、クリオグロブリン"]},{"n":2,"c":"blood","img":"a02","q":"骨髄穿刺液の Wright-Giemsa 染色標本を示す。矢印の細胞はどれか。","o":["多染性赤芽球","骨髄芽球","前単球","好塩基性赤芽球","骨髄球"],"a":[2],"e":["核クロマチンが粗く、細胞質は灰青〜灰紫色。","正しい。核網が繊細で核小体が明瞭、細胞質は狭く好塩基性で顆粒がない。","核にくびれや切れ込みがあり、細胞質は灰青色。","細胞質が濃い青色で、核クロマチンは骨髄芽球より粗い。","細胞質に好中性の二次顆粒があり、核クロマチンが粗い。"],"p":["骨髄芽球：核網が[[繊細]]で[[核小体]]が明瞭、細胞質は狭く好塩基性で顆粒は[[ない]]。","成熟の順：骨髄芽球 → [[前骨髄球]]（アズール顆粒が最も多い）→ [[骨髄球]]（二次顆粒が出現）→ 後骨髄球 → 桿状核球 → 分葉核球","好塩基性赤芽球との鑑別：赤芽球系は細胞質が[[濃い青色]]で、核クロマチンがより粗い。"]},{"n":3,"c":"blood","q":"造血因子でないのはどれか。","o":["エリスロポエチン","トロンボポエチン","M-CSF","トロンビン","IL-3"],"a":[4],"e":["造血因子（赤血球系）。","造血因子（巨核球系）。","造血因子（単球・マクロファージ系）。","正しい。凝固因子（活性化第II因子）で、フィブリノゲンをフィブリンに変える。","造血因子（造血幹細胞・多能性前駆細胞）。"],"p":["[[エリスロポエチン]]：主に[[腎臓]]で産生され、赤芽球系前駆細胞を刺激する。","[[トロンボポエチン]]：主に[[肝臓]]で産生され、巨核球系前駆細胞を刺激する。","[[M-CSF]]：マクロファージ・骨髄間質細胞が産生し、単球・マクロファージ系を刺激する。","[[IL-3]]：T 細胞が産生し、造血幹細胞・肥満細胞を刺激する。","トロンビンは Ca²⁺ と第[[V]]因子の存在下で、第[[Xa]]因子により生成されるセリンプロテアーゼで、フィブリノゲンを[[フィブリン]]に変える。"]},{"n":4,"c":"hemostasis","q":"肝臓で産生される凝固因子でないのはどれか。","o":["フィブリノゲン","第Ⅱ因子","第Ⅲ因子","第Ⅶ因子","第Ⅴ因子"],"a":[3],"e":["肝臓で産生される。","肝臓で産生される（ビタミン K 依存性）。","正しい。組織因子は血管内皮下の細胞に発現する。","肝臓で産生される（ビタミン K 依存性）。","肝臓で産生される。"],"p":["※原文の選択肢4は「第Ⅳ因子」。第Ⅳ因子はカルシウムイオンで肝臓では産生されないため、原文では正答が2つになってしまう。","凝固因子のほとんどは[[肝臓]]で産生されるが、第Ⅲ因子（[[組織因子]]）は[[血管内皮下]]の細胞に発現する。","第Ⅳ因子は[[カルシウムイオン]]","ビタミン K 依存性凝固因子：[[II・VII・IX・X]]"]},{"n":5,"c":"lab","img":"a05","q":"末梢血塗抹標本を示す。矢印の細胞が発現する細胞表面抗原はどれか。","o":["CD14","CD41","CD34","CD19","CD56"],"a":[1],"e":["正しい。矢印は単球で、CD14 陽性。","巨核球・血小板。","造血幹細胞。","B 細胞。","NK 細胞。"],"p":["矢印の細胞：[[単球]]（大型で核にくびれがあり、細胞質は灰青色）","単球：[[CD14]]／巨核球：[[CD41]]／幹細胞：[[CD34]]／B 細胞：[[CD19]]／NK 細胞：[[CD56]]"]},{"n":6,"c":"disease","q":"貧血について正しいのはどれか。","o":["再生不良性貧血では網赤血球が増加する。","慢性炎症による貧血では血清鉄が増加する。","腎性貧血では血清エリスロポエチン値が増加する。","溶血性貧血では網赤血球が増加する。","悪性貧血では網赤血球分利を示す。"],"a":[4],"e":["汎血球減少で赤芽球の産生も低下し、網赤血球は減少する。","ヘプシジンが増えて鉄の吸収・再利用が抑えられ、血清鉄は減少する。","腎臓のエリスロポエチン産生が低下する。","正しい。骨髄の赤血球産生が亢進する。","網赤血球分利（一過性の著増）は、ビタミン B12 投与で治療を始めたあとにみられる。"],"p":["再生不良性貧血：網赤血球[[減少]]","慢性炎症に伴う貧血：[[ヘプシジン]]が増え、血清鉄[[減少]]","腎性貧血：腎臓からの[[エリスロポエチン]]の分泌が減る。","溶血性貧血：網赤血球[[増加]]","悪性貧血：胃壁細胞に対する自己抗体で[[ビタミン B12]]・内因子複合体の吸収が低下し、[[巨赤芽球性貧血]]となる。治療開始後に[[網赤血球分利]]がみられる。"]},{"n":7,"c":"disease","q":"t(9;22) を認めるのはどれか。2つ選べ。","o":["急性リンパ性白血病","Burkitt リンパ腫","本態性血小板血症","慢性骨髄性白血病","濾胞性リンパ腫"],"a":[1,4],"e":["正しい。一部にみられる（Ph 陽性 ALL）。","t(8;14)。","JAK2 遺伝子変異など。","正しい。ほぼ全例にみられる。","t(14;18)。"],"p":["[[t(9;22)]]（フィラデルフィア染色体）：[[慢性骨髄性白血病]]と一部の[[急性リンパ性白血病]]","Burkitt リンパ腫：[[t(8;14)]]／濾胞性リンパ腫：[[t(14;18)]]","本態性血小板血症：[[JAK2]] 遺伝子変異など"]},{"n":8,"c":"hemostasis","q":"播種性血管内凝固〈DIC〉の所見で正しいのはどれか。2つ選べ。","o":["血小板数低下","フィブリノゲン上昇","FDP 上昇","プラスミンインヒビター上昇","プロトロンビン時間短縮"],"a":[1,3],"e":["正しい。消費されて低下する。","消費されて低下する。","正しい。線溶亢進で上昇する。","消費されて低下する（PIC は上昇）。","延長する（PT-INR は高値）。"],"p":["一般止血検査：血小板[[減少]]、FDP・D ダイマー[[上昇]]、フィブリノゲン[[減少]]、PT-INR[[高値]]、赤沈の[[遅延]]","凝固活性化マーカー：アンチトロンビン・プロテイン C [[低下]]、F1+2・SF・TAT [[上昇]]","線溶活性化マーカー：FDP・D ダイマー・[[PIC]] 上昇"]},{"n":9,"c":"lab","q":"血球数算定の際に使用される抗凝固剤はどれか。","o":["ヘパリン","クエン酸ナトリウム","フッ化ナトリウム","シュウ酸塩","EDTA 塩"],"a":[5],"e":["血液ガス測定などに使う。","凝固検査（血液：抗凝固剤＝9：1）、赤沈（4：1）に使う。","血糖測定に使う（解糖を止める）。","以前は凝固検査に使われていたが、現在は使われない。","正しい。血球数算定・血液像に使う。"],"p":["[[EDTA 塩]]：血球数算定・血液像","[[クエン酸ナトリウム]]：凝固検査（血液：抗凝固剤＝[[9：1]]）、赤沈（[[4：1]]）","[[ヘパリン]]：血液ガス測定など","[[フッ化ナトリウム]]：グルコース測定"]},{"n":10,"c":"lab","q":"血球と細胞化学染色法の所見の組み合わせで誤っているのはどれか。","o":["単球 ── 非特異的エステラーゼ染色陽性","好中球 ── 特異的エステラーゼ染色陽性","骨髄球 ── ペルオキシダーゼ染色陽性","好酸球 ── ペルオキシダーゼ染色陽性","リンパ球 ── ペルオキシダーゼ染色陽性"],"a":[5],"e":["正しい組み合わせ。","正しい組み合わせ。","正しい組み合わせ（好中球系は各成熟段階で陽性）。","正しい組み合わせ（強陽性）。","誤り。リンパ球はペルオキシダーゼ陰性。"],"p":["非特異的エステラーゼ染色：[[単球系]]で陽性","特異的エステラーゼ染色：[[好中球系]]で陽性","ペルオキシダーゼ染色：好中球系の各成熟段階で陽性、単球で[[弱陽性]]、好酸球で[[強陽性]]、リンパ球で[[陰性]]"]},{"n":11,"c":"lab","q":"Brecher 法による網赤血球の測定法について正しいのはどれか。","o":["メタノールで固定する。","Miller の接眼レンズを使用する。","メチレン青染色液で染色する。","Bürker-Türk 計算板で測定する。","染色液と血液の混合比率は 1：3 である。"],"a":[2],"e":["固定しない（超生体染色）。","正しい。視野縮小器として使うと数えやすい。","ニューメチレン青を用いる。","塗抹標本を作って鏡検する。","等量（1：1）で混合する。"],"p":["Brecher 法：抗凝固剤を加えた血液と[[ニューメチレン青]]などの超生体染色液を[[等量]]混合し、塗抹標本を作って網赤血球を数える（[[固定しない]]）。","[[Miller]] の接眼レンズなどの視野縮小器を使ってもよい。"]},{"n":12,"c":"disease","img":"a12","q":"骨髄穿刺液の鉄染色標本を示す。鉄顆粒の存在する場所はどれか。","o":["Golgi 装置","リソソーム","リボソーム","グリコーゲン","ミトコンドリア"],"a":[5],"e":["鉄は蓄積しない。","鉄は蓄積しない。","鉄は蓄積しない。","鉄は蓄積しない。","正しい。ヘム合成の場であるミトコンドリアに鉄が蓄積する。"],"p":["環状鉄芽球：ヘムの合成障害のために[[ミトコンドリア]]に蓄積した鉄が染め出される。","ヘムは[[ミトコンドリア]]内で合成され、細胞質で[[グロビン]]と結合してヘモグロビンとなる。","ヘモグロビン1分子は[[4]]本のグロビン鎖と[[4]]分子のヘムからなり、[[4]]分子の酸素を結合できる。"]},{"n":13,"c":"lab","q":"血漿について正しいのはどれか。2つ選べ。","o":["血液から有形成分を除いたものである。","血清から凝固因子を除いたものである。","血液から血餅を取り除いた液体成分である。","血漿を得るためには採血管に抗凝固剤の添加が必要である。","血漿中にはアルブミンは存在しない。"],"a":[1,4],"e":["正しい。","逆。血漿から凝固因子を除いたものが血清。","血清の説明。","正しい。","アルブミンは血漿蛋白で最も多い。"],"p":["血漿からフィブリノゲンなどの[[凝固因子]]を取り除いた成分が[[血清]]。","血液から細胞成分にフィブリンが絡みついてできる[[血餅]]を除いた液体成分が血清。","血漿を得るには採血管に[[抗凝固剤]]を加える。"]},{"n":14,"c":"blood","q":"正常赤血球について正しいのはどれか。","o":["末梢血の網赤血球は1〜2週間で成熟赤血球になる。","正染性赤芽球ではヘモグロビン合成は行われない。","赤血球形態の維持には好気的解糖が行われる。","ヘモグロビンは赤血球重量の2/3を占める。","ヘモグロビンの酸素親和性は pH が上昇すると増加する。"],"a":[5],"e":["1〜2日で成熟赤血球になる。","正染性赤芽球でも合成は続く。","嫌気的解糖で ATP を得る（ミトコンドリアがない）。","約1/3。","正しい（Bohr 効果）。"],"p":["網赤血球は[[1〜2日]]で成熟赤血球になる。","ヘモグロビン合成は前赤芽球から始まり、[[好塩基性赤芽球]]以降に急激に促進される。","赤血球は[[嫌気的解糖]]で ATP を産生する。","ヘモグロビンは赤血球重量の約[[1/3]]を占め、残りの多くは水分。","温度の[[低下]]、二酸化炭素分圧の[[低下]]、pH の[[上昇]]で、ヘモグロビンの酸素親和性は上昇する。"]},{"n":15,"c":"hemostasis","q":"凝固を抑制する物質でないのはどれか。","o":["アンチトロンビン","プロテイン C","組織因子経路インヒビター〈TFPI〉","プロテイン S","組織型プラスミノゲンアクチベータ〈t-PA〉"],"a":[5],"e":["凝固を抑制する（トロンビンを不活化）。","凝固を抑制する（Va・VIIIa を失活）。","凝固を抑制する（組織因子-第VIIa因子複合体を阻害）。","凝固を抑制する（プロテイン C の補酵素）。","正しい。線溶系の開始因子で、凝固を抑制する物質ではない。"],"p":["[[アンチトロンビン]]は、トロンビンと結合して不活化する。","[[プロテイン C]]は、[[プロテイン S]]を補酵素として第[[VIIIa]]・[[Va]]因子を失活させる。","[[TFPI]]は、組織因子-第VIIa因子複合体を阻害する。","[[t-PA]]は、プラスミノゲンを活性化する[[線溶系]]の開始因子。"]},{"n":16,"c":"disease","q":"β サラセミアで正しいのはどれか。","o":["大球性貧血を示す。","HbA2 が増加する。","赤血球浸透圧抵抗は減弱する。","血清フェリチンは低下する。","標的赤血球はまれである。"],"a":[2],"e":["小球性低色素性貧血を示す。","正しい。β鎖の不足を補うように HbA2（α2δ2）や HbF が増える。","増強する。","正常〜上昇する（鉄欠乏性貧血との違い）。","標的赤血球がよくみられる。"],"p":["β サラセミアは β グロビン鎖の合成低下による[[小球性低色素性]]貧血。","[[HbA2]]（α2δ2）や[[HbF]]が代償的に増加する。","末梢血に[[標的赤血球]]がみられ、赤血球浸透圧抵抗は[[増強]]する。","鉄欠乏性貧血との鑑別：サラセミアでは血清フェリチンが[[正常〜上昇]]。"]},{"n":17,"c":"disease","q":"発作性夜間ヘモグロビン尿症〈PNH〉で誤っているのはどれか。","o":["Ham 試験陽性を示す。","ヘモジデリン尿をきたす。","赤血球 CD55 の欠損がある。","血管外溶血をきたす。","夜間低換気状態で溶血発作を起こす。"],"a":[4],"e":["正しい。酸性化した血清中で補体が活性化され溶血する。","正しい。慢性の血管内溶血で尿中にヘモジデリンが出る。","正しい。CD59 も欠損する。","誤り。補体による血管内溶血をきたす。","正しい。睡眠中の低換気（アシドーシス）で補体が活性化される。"],"p":["造血幹細胞の遺伝子変異で[[GPI アンカー]]の合成が障害され、補体制御因子の[[CD55（DAF）]]・[[CD59]]が欠損する。","補体の活性化を抑えられず、[[血管内溶血]]をおこす。","[[ヘモグロビン尿]]（早朝尿が暗赤色）、[[ヘモジデリン尿]]、NAP 活性[[低下]]","診断は[[フローサイトメトリー]]で CD55・CD59 が陰性の PNH 型血球を検出する（Ham 試験・砂糖水試験は古典的な検査）。","[[再生不良性貧血]]との合併・移行が多い。"]},{"n":18,"c":"blood","q":"造血幹細胞で誤っているのはどれか。","o":["自己複製能を有する。","骨髄微小環境の影響を受ける。","細胞表面抗原は CD34 陽性である。","ほとんどが細胞周期の分裂期にある。","G-CSF の投与により末梢血中に増加する。"],"a":[4],"e":["正しい。","正しい。ニッチ（骨髄微小環境）や造血因子に依存して分化・増殖する。","正しい。","誤り。大部分は細胞周期の G0 期（静止期）にある。","正しい。末梢血幹細胞の採取に利用する。"],"p":["造血幹細胞は[[多分化能]]と[[自己複製能]]をもつ。","細胞表面抗原は[[CD34]]陽性である。","大部分は細胞周期の[[G0 期（静止期）]]にあり、必要に応じて分裂する。","分化や増殖は[[骨髄微小環境]]や[[造血因子]]に依存する。","造血幹細胞移植では[[G-CSF]]を投与して、末梢血に造血幹細胞を動員する。"]},{"n":19,"c":"blood","q":"リンパ球で正しいのはどれか。","o":["B 細胞は骨髄で産生される。","形質細胞は MHC classⅡ を発現する。","末梢血リンパ球は T 細胞よりも B 細胞が多い。","T 細胞はトロンボポエチンの刺激で産生される。","リンパ節の構成細胞はほとんどが B 細胞である。"],"a":[1],"e":["正しい。B 細胞は骨髄で発生・分化する。","形質細胞に分化すると MHC classⅡ は消失する。","T 細胞が約 70〜75% を占め、B 細胞より多い。","T 細胞は胸腺で成熟する。トロンボポエチンは巨核球・血小板の造血因子。","リンパ節でもリンパ球の多くは T 細胞である。"],"p":["T 細胞は[[胸腺]]で成熟し、主に[[細胞性免疫]]を担う。","末梢血やリンパ節では、リンパ球の約[[70〜75]]%が T 細胞である。","ヘルパー T 細胞は[[MHC classⅡ]]、細胞傷害性 T 細胞は[[MHC classⅠ]]に提示された抗原と反応する。","[[制御性 T 細胞]]は過剰な免疫反応や自己免疫疾患を防ぐ（2025年ノーベル生理学・医学賞：坂口志文）。","B 細胞は[[骨髄]]で発生・分化し、[[形質細胞]]に分化して抗体を産生する（形質細胞では MHC classⅡ は消失）。"]},{"n":20,"c":"disease","q":"悪性貧血で正しいのはどれか。","o":["MCV は低下する。","好中球の過分葉がみられる。","血清 LD は低下する。","血清間接ビリルビンは低下する。","抗内因子抗体は陰性である。"],"a":[2],"e":["大球性貧血なので MCV は上昇する。","正しい。巨赤芽球性貧血の特徴的な所見。","無効造血で骨髄内の赤芽球が壊れるため、LD は著しく上昇する。","無効造血による溶血で上昇する。","陽性になる（抗胃壁細胞抗体も陽性）。"],"p":["ビタミン B12 や葉酸の欠乏で[[DNA 合成]]が障害され、核と細胞質の成熟が解離した[[巨赤芽球]]が出現する。","[[大球性正色素性]]貧血で、好中球の[[過分葉]]がみられる。","骨髄内で赤芽球が壊れる[[無効造血]]により、LD と間接ビリルビンが[[上昇]]する。","悪性貧血は[[抗内因子抗体]]・抗胃壁細胞抗体による B12 吸収障害。萎縮性胃炎、ハンター舌炎、[[亜急性連合性脊髄変性症]]を伴う。"]},{"n":21,"c":"disease","q":"温式自己免疫性溶血性貧血で認められるのはどれか。2つ選べ。","o":["直接クームス試験陽性","血清ハプトグロビン増加","球状赤血球の出現","網赤血球減少","血清間接ビリルビン低下"],"a":[1,3],"e":["正しい。赤血球に結合した IgG（や補体）を検出する。","溶血で消費され低下する。","正しい。脾臓のマクロファージに膜の一部を貪食されて球状になる。","骨髄の代償で増加する。","溶血で上昇する。"],"p":["温式 AIHA は[[IgG]]型の自己抗体が赤血球に結合し、主に[[脾臓]]で破壊される（血管外溶血）。","[[直接クームス試験]]は赤血球に結合した抗体・補体を、[[間接クームス試験]]は血清中の遊離抗体を検出する。","溶血の所見：網赤血球[[増加]]、間接ビリルビン[[上昇]]、LD[[上昇]]、ハプトグロビン[[低下]]","寒冷凝集素症は[[IgM]]型の自己抗体が低温で反応する。"]},{"n":22,"c":"disease","q":"慢性骨髄性白血病で正しいのはどれか。","o":["NAP スコアは上昇する。","好塩基球が増加する。","末梢血に芽球は出現しない。","t(15;17) が特徴的である。","血小板数は減少することが多い。"],"a":[2],"e":["低下する（真性赤血球増加症や類白血病反応では上昇）。","正しい。好酸球も増加する。","骨髄芽球から好中球まで各成熟段階の顆粒球が出現する。","t(9;22) が特徴的。t(15;17) は APL（M3）。","慢性期には増加することが多い。"],"p":["[[t(9;22)]]（[[フィラデルフィア染色体]]）により[[BCR-ABL1]]融合遺伝子ができる。","末梢血に骨髄芽球から好中球まで[[各成熟段階]]の顆粒球が出現する（白血病裂孔はない）。","[[好塩基球]]・好酸球が増加し、血小板も増加することが多い。","NAP スコア[[低下]]、血清ビタミン B12[[上昇]]","NAP が低いのは、増えている好中球が[[腫瘍クローン]]由来で、正常な好中球の性質をもたないため（類白血病反応では[[上昇]]するので鑑別に使う）。","B12 が高いのは、顆粒球が産生する B12 結合蛋白[[トランスコバラミンⅠ（ハプトコリン）]]が増えるため（使える B12 が増えるわけではない）。","治療は[[チロシンキナーゼ阻害薬]]（イマチニブなど）。進行すると[[急性転化]]をおこす。"]},{"n":23,"c":"lab","q":"赤血球沈降速度が促進するのはどれか。2つ選べ。","o":["多血症","多発性骨髄腫","低フィブリノゲン血症","貧血","遺伝性球状赤血球症"],"a":[2,4],"e":["赤血球が多いと遅延する。","正しい。M 蛋白（γグロブリン）の増加で連銭形成が進む。","フィブリノゲンが少ないと遅延する。","正しい。赤血球が少ないと沈みやすい。","赤血球の形態異常で連銭形成が起こりにくく遅延する。"],"p":["赤沈は[[フィブリノゲン]]や[[γグロブリン]]の増加で赤血球の連銭形成が進み、促進する。","促進：炎症・感染症、[[多発性骨髄腫]]、[[貧血]]、妊娠、膠原病","遅延：[[多血症]]、低フィブリノゲン血症（DIC など）、赤血球の形態異常（球状・鎌状）","Westergren 法：[[3.2%クエン酸ナトリウム]]と血液を[[1：4]]で混和し、1時間値を読む。"]},{"n":24,"c":"lab","q":"血液凝固検査の検体の採取と処理で正しいのはどれか。","o":["抗凝固剤には EDTA-2K を用いる。","抗凝固剤と血液の比は 1：4 である。","ヘマトクリット値が著しく高い場合は抗凝固剤の量を減らす。","採血後は冷蔵保存する。","採血量が不足しても測定値に影響しない。"],"a":[3],"e":["3.2% クエン酸ナトリウムを用いる。","1：9 である（1：4 は赤沈）。","正しい。血漿量が少ないため、クエン酸が相対的に過剰になる。","室温で保存する。冷却すると第VII因子の活性化などが起こる。","クエン酸が相対的に過剰になり、PT・APTT が延長する。"],"p":["抗凝固剤は[[3.2%クエン酸ナトリウム]]、血液との比は[[1：9]]","Ht が[[55]]%を超える場合は、抗凝固剤の量を[[減らして]]補正する。","採血量の不足はクエン酸過剰となり、PT・APTT が[[延長]]する。","検体は[[室温]]で保存し、遠心後なるべく早く測定する。","翼状針で最初に採血するときは[[空採血]]（ダミー管）を行い、採血量不足を防ぐ。"]}];

const CATS = [["all","すべて"],["blood","血球・造血"],["hemostasis","止血・凝固・線溶"],["disease","造血器疾患"],["lab","検査法"]];
const CATNAME = Object.fromEntries(CATS);
const KEY = "ketsueki2-drill-v2";
let rec = {};
try { rec = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { rec = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch(e) {} };

let cat = "all", filter = "all", order = Q.map(q => q.n), cur = 1, picked = [];

function list(){
  return order.map(n => Q[n-1]).filter(q =>
    (cat === "all" || q.c === cat) &&
    (filter === "all" || (filter === "todo" && !rec[q.n]) || (filter === "ng" && rec[q.n] && !rec[q.n].ok)));
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const blanks = s => esc(s).replace(/\[\[(.+?)\]\]/g, (_, t) => `<button type="button" class="blank" aria-label="空欄をタップして表示">${t}</button>`);

function renderHead(){
  const done = Object.keys(rec).length, ok = Object.values(rec).filter(r => r.ok).length;
  document.getElementById("stats").innerHTML =
    `<span><b>${done}</b>/ ${Q.length} 問 解答</span><span><b>${ok}</b>問 正解</span><span>正答率 <b>${done ? Math.round(ok/done*100) : 0}</b>%</span>`;
  document.getElementById("bar").innerHTML =
    `<i class="b-ok" style="width:${ok/Q.length*100}%"></i><i class="b-ng" style="width:${(done-ok)/Q.length*100}%"></i>`;
  const vis = new Set(list().map(q => q.n));
  document.getElementById("map").innerHTML = order.map(n => {
    const r = rec[n];
    return `<button class="cell ${r ? (r.ok ? "ok" : "ng") : ""} ${n === cur ? "cur" : ""} ${vis.has(n) ? "" : "dim"}" data-n="${n}" aria-label="問題${n}">${n}</button>`;
  }).join("");
}

function render(){
  renderHead();
  const L = list(), main = document.getElementById("main");
  if (!L.length){ main.innerHTML = `<div class="card empty">${filter === "ng" ? "間違えた問題はありません。" : filter === "todo" ? "すべて解答済みです。" : "該当する問題がありません。"}</div>`; return; }
  if (!L.some(q => q.n === cur)) cur = L[0].n;
  const q = Q[cur-1], r = rec[q.n], answered = !!r, need = q.a.length;
  const idx = L.findIndex(x => x.n === cur);
  const sel = answered ? r.sel : picked;
  let h = `<article class="card">
    <div class="qhead"><span class="qno">問題 ${q.n}</span><span class="tag">${CATNAME[q.c]}</span>${need > 1 ? '<span class="tag two">2つ選ぶ</span>' : ""}<span class="tag" style="margin-left:auto">${idx+1} / ${L.length}</span></div>
    <p class="stem">${esc(q.q)}</p>
    ${q.img ? `<figure class="fig"><img src="${IMG[q.img]}" alt="問題${q.n}の標本写真"></figure>` : ""}
    <ol class="opts">`;
  q.o.forEach((t, i) => {
    const k = i+1, isAns = q.a.includes(k), isSel = sel.includes(k);
    let cls = "", mk = "";
    if (answered){ if (isAns){ cls = "right"; mk = "正答"; } else if (isSel){ cls = "wrong"; mk = "あなたの解答"; } }
    else if (isSel) cls = "sel";
    h += `<li><button class="opt ${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="num">${k}</span><span>${esc(t)}</span><span class="mk">${mk}</span>${answered ? `<span class="note">${esc(q.e[i])}</span>` : ""}</button></li>`;
  });
  h += `</ol>`;
  if (answered){
    const ansTxt = q.a.join("・");
    h += `<div class="verdict ${r.ok ? "ok" : "ng"}">${r.ok ? "正解" : "不正解"}<span>正答は ${ansTxt}</span></div>
      <section class="points"><h2>要点チェック <button class="btn ghost" id="openAll">空欄をすべて表示</button></h2>
      <p class="hint">色のついた空欄をタップすると答えが出ます。</p>
      <ul>${q.p.map(p => `<li>${blanks(p)}</li>`).join("")}</ul></section>`;
  }
  h += `<div class="actions">
      <button class="btn" id="prev" ${idx === 0 ? "disabled" : ""}>← 前へ</button>
      <span style="display:flex;gap:8px;flex-wrap:wrap">
      ${answered ? `<button class="btn ghost" id="retry">もう一度解く</button>` : need > 1 ? `<button class="btn primary" id="submit" ${picked.length === need ? "" : "disabled"}>解答する（${picked.length}/${need}）</button>` : ""}
      <button class="btn ${answered ? "primary" : ""}" id="next" ${idx === L.length-1 ? "disabled" : ""}>次へ →</button></span>
    </div></article>`;
  main.innerHTML = h;
}

function grade(){
  const q = Q[cur-1], s = [...picked].sort();
  rec[q.n] = { sel: s, ok: s.length === q.a.length && s.every((v,i) => v === [...q.a].sort()[i]) };
  picked = []; save(); render();
}
function choose(k){
  const q = Q[cur-1]; if (rec[q.n]) return;
  if (q.a.length === 1){ picked = [k]; grade(); return; }
  picked = picked.includes(k) ? picked.filter(x => x !== k) : picked.length < q.a.length ? [...picked, k] : [picked[1], k];
  render();
}
function go(d){ const L = list(), i = L.findIndex(x => x.n === cur), j = i + d; if (j >= 0 && j < L.length){ cur = L[j].n; picked = []; render(); window.scrollTo({top: document.getElementById("map").offsetTop - 8}); } }

document.getElementById("cats").innerHTML = CATS.map(([k,v]) => `<button class="chip" data-c="${k}" aria-pressed="${k === cat}">${v}</button>`).join("");
document.getElementById("cats").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); picked = []; render(); };
document.getElementById("filter").onchange = e => { filter = e.target.value; picked = []; render(); };
document.getElementById("shuffle").onchange = e => {
  order = Q.map(q => q.n);
  if (e.target.checked) for (let i = order.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [order[i], order[j]] = [order[j], order[i]]; }
  const L = list(); if (L.length) cur = L[0].n; picked = []; render();
};
document.getElementById("map").onclick = e => { const b = e.target.closest(".cell"); if (b){ cur = +b.dataset.n; picked = []; if (!list().some(q => q.n === cur)){ cat = "all"; filter = "all"; document.getElementById("filter").value = "all"; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.c === "all")); } render(); } };
document.getElementById("main").onclick = e => {
  const t = e.target;
  const o = t.closest(".opt"); if (o && !o.disabled) return choose(+o.dataset.k);
  const bl = t.closest(".blank"); if (bl){ bl.classList.add("open"); return; }
  if (t.id === "openAll") document.querySelectorAll(".blank").forEach(b => b.classList.add("open"));
  if (t.id === "submit") grade();
  if (t.id === "prev") go(-1);
  if (t.id === "next") go(1);
  if (t.id === "retry"){ delete rec[cur]; save(); picked = []; render(); }
};
document.getElementById("resetArea").onclick = e => {
  const area = document.getElementById("resetArea");
  if (e.target.id === "reset") area.innerHTML = `<span class="confirm">全問の記録を消しますか？ <button class="btn" id="yes">消す</button><button class="btn ghost" id="no">やめる</button></span>`;
  if (e.target.id === "yes"){ rec = {}; save(); render(); }
  if (e.target.id === "yes" || e.target.id === "no") area.innerHTML = `<button class="btn ghost" id="reset">記録をリセット</button>`;
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const q = Q[cur-1]; if (!q) return;
  if (/^[1-5]$/.test(e.key)) choose(+e.key);
  else if (e.key === "Enter"){ if (!rec[q.n] && q.a.length > 1 && picked.length === q.a.length){ e.preventDefault(); grade(); } else if (rec[q.n]){ e.preventDefault(); go(1); } }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});
render();
</script>
